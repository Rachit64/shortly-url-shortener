# A real MongoDB for development or a small deployment:
#   docker compose up -d
#   then set MONGODB_URI=mongodb://127.0.0.1:27017/terse in server/.env
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
